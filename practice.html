<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TOEIC Part 5 Practice</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <main class="app-shell">
        <section class="practice-panel" aria-labelledby="app-title">
            <header class="topbar">
                <div>
                    <p class="eyebrow">TOEIC Part 5</p>
                    <h1 id="app-title">20초 문법 문제풀이</h1>
                </div>
                <div class="topbar-actions">
                    <a class="ghost-button link-button" href="index.html">메인으로</a>
                    <button class="ghost-button" id="resetStatsButton" type="button">기록 초기화</button>
                </div>
            </header>

            <div class="status-grid" aria-label="학습 상태">
                <div class="status-item">
                    <span>진행</span>
                    <strong id="progressText">1 / 80</strong>
                </div>
                <div class="status-item">
                    <span>세션 정답</span>
                    <strong id="sessionScoreText">0</strong>
                </div>
                <div class="status-item timer-status">
                    <span>남은 시간</span>
                    <strong><span id="timeLeftText">20</span>초</strong>
                </div>
            </div>

            <div class="timer-track" aria-hidden="true">
                <div class="timer-fill" id="timerFill"></div>
            </div>

            <article class="question-box" aria-live="polite">
                <div class="question-meta">
                    <span id="grammarPointText">품사</span>
                    <span id="difficultyText">중급</span>
                </div>
                <p class="question-sentence" id="sentenceText"></p>
                <div class="choices" id="choicesContainer"></div>
            </article>

            <section class="result-panel hidden" id="resultPanel" aria-live="polite">
                <p class="result-title" id="resultTitle"></p>
                <p class="answer-line" id="answerLine"></p>
                <p class="explanation" id="explanationText"></p>
            </section>

            <div class="actions">
                <button class="primary-button" id="nextButton" type="button" disabled>다음 문제</button>
                <button class="secondary-button" id="restartButton" type="button">처음부터</button>
            </div>
        </section>

        <aside class="side-panel" aria-label="누적 기록과 학습 방향">
            <img class="study-visual" src="assets/toeic-practice.png" alt="TOEIC Part 5 학습 일러스트">
            <div class="stats-block">
                <h2>누적 기록</h2>
                <dl class="stats-list">
                    <div>
                        <dt>풀이 수</dt>
                        <dd id="totalSolvedText">0</dd>
                    </div>
                    <div>
                        <dt>정답률</dt>
                        <dd id="accuracyText">0%</dd>
                    </div>
                    <div>
                        <dt>시간초과</dt>
                        <dd id="timeoutText">0</dd>
                    </div>
                    <div>
                        <dt>평균 시간</dt>
                        <dd id="averageTimeText">0.0초</dd>
                    </div>
                </dl>
            </div>
            <div class="guide-block">
                <h2>AI 문제 생성 방향</h2>
                <p>기출 원문을 복제하지 않고 문법 포인트와 오답 유형을 기준으로 새 문제를 생성하는 구조입니다.</p>
            </div>
        </aside>
    </main>

    <script src="questions.js"></script>
    <script src="app.js"></script>
</body>
</html>
